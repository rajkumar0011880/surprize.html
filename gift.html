<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Surprise 🎁</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 45px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 550px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .gift {
            font-size: 100px;
            animation: bounce 1.5s infinite;
            margin: 20px;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            background: white;
            color: #764ba2;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #surprise {
            display: none;
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .message {
            font-size: 25px;
            line-height: 1.6;
            margin-top: 20px;
        }

        .star {
            position: absolute;
            color: white;
            font-size: 20px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Floating stars -->
    <div class="star" style="left:10%; animation-delay:0s;">✨</div>
    <div class="star" style="left:25%; animation-delay:1s;">⭐</div>
    <div class="star" style="left:45%; animation-delay:2s;">✨</div>
    <div class="star" style="left:65%; animation-delay:3s;">⭐</div>
    <div class="star" style="left:85%; animation-delay:1.5s;">✨</div>

    <div class="container">

        <!-- First screen -->
        <div id="welcome">

            <h1>Hey! 👋</h1>

            <div class="gift">🎁</div>

            <p>
                I have prepared something special for you...
            </p>

            <button onclick="openSurprise()">
                🎀 Click to Open
            </button>

        </div>


        <!-- Surprise screen -->
        <div id="surprise">

            <div class="gift">🎉</div>

            <h1>Surprise! ✨</h1>

            <div class="message">
                You are capable of amazing things! 🌟
                <br><br>
                Keep learning.
                Keep growing.
                Keep believing in yourself. 💖
                <br><br>
                Your journey has only just begun! 🚀
            </div>

        </div>

    </div>


    <script>

        function openSurprise() {

            document.getElementById("welcome").style.display = "none";

            document.getElementById("surprise").style.display = "block";

            createConfetti();
        }


        function createConfetti() {

            for (let i = 0; i < 80; i++) {

                let confetti = document.createElement("div");

                confetti.innerHTML = "🎊";

                confetti.style.position = "fixed";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.top = "-20px";
                confetti.style.fontSize = "20px";
                confetti.style.zIndex = "1000";

                document.body.appendChild(confetti);

                let speed = Math.random() * 3 + 2;

                confetti.animate(
                    [
                        { transform: "translateY(0) rotate(0deg)" },
                        { transform: "translateY(110vh) rotate(720deg)" }
                    ],
                    {
                        duration: speed * 1000,
                        easing: "linear"
                    }
                );

                setTimeout(() => {
                    confetti.remove();
                }, speed * 1000);
            }
        }

    </script>

</body>
</html>
